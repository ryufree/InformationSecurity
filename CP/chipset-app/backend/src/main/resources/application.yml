server:
  port: 9090

spring:
  # ── H2 인메모리 DB (Oracle 설치 전 개발용) ──────────────────────
  # datasource:
  #   driver-class-name: org.h2.Driver
  #   url: jdbc:h2:mem:chipsetdb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
  #   username: sa
  #   password:

  # H2 웹 콘솔 — http://localhost:8080/h2-console
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console

  # schema.sql 자동 실행 (테이블·시퀀스 생성)
  # sql:
  #   init:
  #     mode: always

  # ── Oracle 설정 활성화 ──
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: chipset
    password: chipset123
  sql:
    init:
      mode: never   # Oracle은 DBeaver에서 DDL 직접 실행했으므로 never

  # ── Oracle 준비 후: 위 datasource 주석 처리하고 아래 주석 해제 ──
  # datasource:
  #   driver-class-name: oracle.jdbc.OracleDriver
  #   url: jdbc:oracle:thin:@localhost:1521/XEPDB1
  #   username: chipset
  #   password: chipset123
  # sql:
  #   init:
  #     mode: never   # Oracle은 DBeaver에서 DDL 직접 실행

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.chipset: DEBUG
