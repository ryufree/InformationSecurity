# ============================================
# DB Property 로딩 제어
# true  → DB 에서 property 를 읽어 파일보다 우선 적용 (기본값)
# false → DB 로딩 스킵, 파일 property 만 사용
# JVM 인수로도 재정의 가능: -Dmaru.db-property.enabled=false
# ============================================
maru.db-property.enabled=true

# ============================================
# 공통 설정 (모든 환경 공통)
# ============================================
maru.m02.mail.pop3.user=maru
maru.m02.mail.pop3.password=mailpassword123
maru.common.timeout=30
maru.common.retry-count=3
